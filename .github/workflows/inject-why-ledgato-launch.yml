name: Inject launch-candidate LEDGATo education

on:
  push:
    branches: [codex/launch-candidate]
    paths:
      - .github/workflows/inject-why-ledgato-launch.yml

permissions:
  contents: write

jobs:
  update-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add beginner-friendly why LEDGATo section
        env:
          PATCH_SCRIPT_B64: 
        run: |
          echo "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/patch_ledgato_launch.py
          python /tmp/patch_ledgato_launch.py
      - name: Commit landing education
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "add plain-language why LEDGATo education to launch candidate"
          git push origin HEAD:codex/launch-candidate

name: engine-tests

on:
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/engine-tests.yml'
  push:
    branches:
      - build/enforcement-foundation
    paths:
      - 'engine/**'
      - '.github/workflows/engine-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e './engine[dev]'
      - name: Test
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q engine/tests 2>&1 | tee pytest-output.txt
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ github.run_id }}
          path: pytest-output.txt
      - name: Fail if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

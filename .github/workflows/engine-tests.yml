name: engine-tests

on:
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/engine-tests.yml'
  push:
    branches:
      - build/enforcement-foundation
    paths:
      - 'engine/**'
      - '.github/workflows/engine-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e './engine[dev]'
      - name: Test
        run: pytest -q engine/tests

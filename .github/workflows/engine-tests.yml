name: engine-tests

on:
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/engine-tests.yml'
  push:
    branches:
      - build/enforcement-foundation
    paths:
      - 'engine/**'
      - '.github/workflows/engine-tests.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e './engine[dev]'
      - name: Test
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q engine/tests 2>&1 | tee pytest-output.txt
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ github.run_id }}
          path: pytest-output.txt
      - name: Fail if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  github-denial-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine
        run: python -m pip install -e './engine'
      - name: Prove denied merge never crosses GitHub boundary
        env:
          LEDGATO_GITHUB_REPOSITORY: ${{ github.repository }}
          LEDGATO_GITHUB_TOKEN: ${{ github.token }}
          LEDGATO_PROOF_PULL_NUMBER: ${{ github.event.pull_request.number }}
          LEDGATO_PROOF_STATE: .ledgato-proof
        run: |
          set -o pipefail
          python engine/examples/prove_github_denial.py 2>&1 | tee github-denial-proof.txt
      - name: Upload signed proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-denial-proof-${{ github.run_id }}
          include-hidden-files: true
          path: |
            github-denial-proof.txt
            .ledgato-proof/

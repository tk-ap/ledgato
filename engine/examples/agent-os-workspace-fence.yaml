# Ledgato policy for AgentOS control-surface -> governed execution boundaries.
#
# The browser does not hold this credential. AgentOS presents a dedicated
# `agent` principal. Routine dispatch remains directly allowlisted; the one
# root-affecting host operation is separately approval-gated and can execute
# only through the fixed Ledgato host helper.
#
# This policy does NOT grant arbitrary shell, sudo, systemd, filesystem,
# publishing, deployment, purchase, or browser authority.

policies:
  - agent: agent-os-workspace
    allow_tool:
      - agentos.dispatch
      - host.agentos.runtime.status
      - host.agentos.runtime.activate
      - ledgato.session.grant
      - github.pull.merge
      # Agents' own GitHub credential is read-only on agent-os; their branches
      # reach a pull request through the gateway. Allowed without a card: the
      # adapter refuses main and every ref but the one declared branch.
      - github.branch.publish
    approve_tool:
      - host.agentos.runtime.activate
      # Merges into tk-ap/agent-os go through Ledgato's GitHub adapter (the
      # token lives only in the service environment) and are the owner's call,
      # per merge or covered by an owner session grant.
      - github.pull.merge
      # A session grant is always the owner's call; once approved it stands in
      # for per-action approval inside its own scope (adapters/session.py).
      - ledgato.session.grant
    impact_max: write
    data_domains:
      - workspace-command::*
      - telegram-command::*
      - hermes-command::*
      - autonomous-backlog::*
      - ashwood-host-01
      - ledgato-session::*
      - tk-ap/agent-os
      # Ledgato's own repository, through the github:tk-ap/ledgato adapter.
      - tk-ap/ledgato
    # Changes to Ledgato itself: one owner card per merge. A session grant
    # never covers them (TK, 2026-10-28).
    card_only_domains:
      - tk-ap/ledgato
    on_deny:
      - alert
      - human_review

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgato"
version = "0.3.0"
description = "Ledgato — vendor-neutral agent assurance with enforceable authority boundaries, approvals, delegated/JIT grants, live discovery, and signed evidence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=41.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
ledgato = "ledgato.cli:main"

[tool.setuptools.packages.find]
include = ["ledgato*"]

[tool.pytest.ini_options]
# Tiering is ENFORCED in tests/conftest.py, not here: CI invokes pytest from the
# repository root, where this file may not be selected as the config source. A
# marker expression left only in this section could silently stop applying and
# let live-provider tests run against a real repository.
markers = [
    "live: needs a real provider credential; opt-in via LEDGATO_LIVE_TESTS=1",
    "sandbox: needs bubblewrap (bwrap) on the host",
]

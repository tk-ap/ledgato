[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgato"
version = "0.3.0"
description = "Ledgato — vendor-neutral agent assurance with enforceable authority boundaries, approvals, delegated/JIT grants, live discovery, and signed evidence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=41.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
ledgato = "ledgato.cli:main"

[tool.setuptools.packages.find]
include = ["ledgato*"]

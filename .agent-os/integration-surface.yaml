version: 0.1.0
product_key: ledgato
agent_os_repository: tk-ap/agent-os
routing_source: registry/product-routing.yaml

# Contract paths without `repository:` resolve in tk-ap/agent-os.
# Entries with `repository: tk-ap/ledgato` are local contracts implemented here.

inbound:
  - from: agent-os-workforce
    contract: contracts/capability-manifest.schema.json
    purpose: receive the minimum declared workforce/tool surface when a governed task materially requires governance or enforcement evaluation
  - from: agent-os-workforce
    contract: contracts/work-item.schema.json
    purpose: receive an explicitly scoped governance/enforcement work item rather than generic sensitive work
  - from: agent-os-workforce
    repository: tk-ap/ledgato
    contract: contracts/action-contract.schema.json
    purpose: mandatory checkpoint for one consequential action at an enforced boundary (POST /v1/enforcement/decide)
    evidence_state: implemented, tested, lab-verified; not deployed
  - from: agent-os-workforce
    repository: tk-ap/ledgato
    contract: contracts/authority-request.schema.json
    purpose: evaluate declared authority for governed work against the applicable policy (POST /v1/authority/resolve)
    evidence_state: implemented, tested; status store is in-memory

  - from: ledgato-mobile-operator
    repository: tk-ap/ledgato
    contract: contracts/mobile-device-enrollment.schema.json
    purpose: enroll one authenticated operator device public key and platform-integrity evidence
    evidence_state: specification only; not implemented
  - from: ledgato-mobile-operator
    repository: tk-ap/ledgato
    contract: contracts/mobile-push-registration.schema.json
    purpose: bind one APNs delivery token to an already authenticated/enrolled device without creating authority
    evidence_state: specification only; not implemented
  - from: ledgato-mobile-operator
    repository: tk-ap/ledgato
    contract: contracts/mobile-signed-decision.schema.json
    purpose: submit a device-signed APPROVE or DENY response for one exact server challenge
    evidence_state: specification only; not implemented

outbound:
  - to: agent-os-workforce
    contract: contracts/outcome-event.schema.json
    trigger: a gate, probe, attestation, drift check, or enforcement evaluation produces verifiable evidence
  - to: agent-os-workforce
    repository: tk-ap/ledgato
    contract: contracts/enforcement-permit.schema.json
    trigger: an action contract is allowed; the permit is the only thing the protected resource accepts
    evidence_state: implemented, tested, lab-verified; not deployed
  - to: agent-os-workforce
    repository: tk-ap/ledgato
    contract: contracts/authority-decision.schema.json
    trigger: an authority request is evaluated
    evidence_state: implemented, tested
  - to: agent-os-workforce
    repository: tk-ap/ledgato
    contract: contracts/decision-prompt.schema.json
    trigger: a protected action is paused pending an owner/approver decision
    evidence_state: implemented contract + API projection; transport rendering is adapter-owned
  - to: ailhat
    repository: tk-ap/ledgato
    contract: contracts/authority-status.schema.json
    trigger: readiness state for a work item changes (GET /v1/authority/status/{work_id})
    evidence_state: implemented, tested; in-memory, lost on restart

  - to: ledgato-mobile-operator
    repository: tk-ap/ledgato
    contract: contracts/mobile-push-envelope.schema.json
    trigger: a pending/updated approval should wake the operator client; delivery never grants authority
    evidence_state: specification only; not implemented
  - to: ledgato-mobile-operator
    repository: tk-ap/ledgato
    contract: contracts/mobile-approval-challenge.schema.json
    trigger: an authenticated mobile client fetches one authoritative approval challenge
    evidence_state: specification only; not implemented
  - to: ledgato-mobile-operator
    repository: tk-ap/ledgato
    contract: contracts/mobile-approval-receipt.schema.json
    trigger: the operator client requests the resulting decision/execution/provider-verification read model
    evidence_state: specification only; not implemented

cross_market: []

rules:
  use_portable_contracts_for_cross_product_handoffs: true
  cross_market_policy: policies/CROSS_MARKET_POLICY.md
  integration_claims_require_verified_implementation: true
  generic_authorization_requests_do_not_route_to_ledgato_by_default: true
  signed_evidence_does_not_expand_task_authority: true
